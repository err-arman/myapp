name: Integration testing

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy: # Moved strategy inside the build job
      matrix:
        node-version: [21.x, 25.x, 26.x] # Fixed indentation

    steps:
      # CRITICAL: Added checkout so your project files exist on the server
      - uses: actions/checkout@v4 

      # Fixed dash and combined name/uses into one clean step
      - name: Setup Interactive SSH Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          
      - run: npm i 
      - run: npm run build