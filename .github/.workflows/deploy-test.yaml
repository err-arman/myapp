name: Integration testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispath:

  strategy:
    matrix:
    node-version: [18.x, 19.x, 20.x]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Interactiv SSH Terminal
      - uses: mxschmitt/action-tmate@v3
        with:
          detached: false

      - name: Use Node.js ${{matrix.node-version}}
        uses: action/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm i 
      - run: npm run build